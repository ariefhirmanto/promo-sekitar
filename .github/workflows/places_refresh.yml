name: places_refresh

on:
  schedule:
    - cron: "0 20 1,15 * *"   # 20:00 UTC = 03:00 WIB on the 2nd and 16th
  workflow_dispatch:

# Shared with promos_daily, which starts at the same time: the two queue instead of writing the
# sheet at once.
concurrency:
  group: sheet-writes
  cancel-in-progress: false

jobs:
  places:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: places-fetcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go mod tidy
      - run: go test ./...
      - run: go run ./app
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
