Places:
  Provider: "overpass"             # which adapter in outlet/provider runs (go run ./app -h lists them)
  BBox: "-6.80,106.40,-5.95,107.30" # Jabodetabek: south,west,north,east

# Settings for the overpass adapter; each adapter reads its own section.
Overpass:
  Endpoints:
    - "https://overpass-api.de/api/interpreter"
    - "https://overpass.private.coffee/api/interpreter"
    - "https://overpass.kumi.systems/api/interpreter"
  UserAgent: "makandimana-places-fetcher/0.1"
  TimeoutSeconds: 200
  Retries: 3
  RetryWaitSeconds: 30

# Keep URL and Token empty here; set SHEET_URL and SHEET_TOKEN (the Apps Script WRITE_TOKEN) in the environment.
Sheet:
  URL: ""
  Token: ""
  TimeoutSeconds: 120

Outlet:
  MergeRadiusM: 50
