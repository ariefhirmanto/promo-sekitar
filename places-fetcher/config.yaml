Places:
  Provider: "overpass"             # which adapter in outlet/provider runs (go run ./app -h lists them)
  BBox: "-6.80,106.40,-5.95,107.30" # Jabodetabek: south,west,north,east

# Settings for the overpass adapter; each adapter reads its own section.
Overpass:
  Endpoints:
    - "https://overpass-api.de/api/interpreter"
    - "https://overpass.private.coffee/api/interpreter"
    - "https://overpass.kumi.systems/api/interpreter"
  UserAgent: "makandimana-places-fetcher/0.1"
  TimeoutSeconds: 200
  Retries: 3
  RetryWaitSeconds: 30

# Keep URL and Token empty here; set SHEET_URL and SHEET_TOKEN (the Apps Script WRITE_TOKEN) in the environment.
Sheet:
  URL: ""
  Token: ""
  TimeoutSeconds: 120

Outlet:
  MergeRadiusM: 50

# Promo job (go run ./app/promos); the sources tab says what to read.
Promo:
  UserAgent: "makandimana-promo-fetcher/0.1"
  FetchTimeoutSeconds: 120
  MaxErrors: 3

# Settings for the web_page source adapter.
WebPage:
  TimeoutSeconds: 30
  Retries: 2
  HostDelayMs: 1000   # 1 request a second per host
  MaxNewItems: 25     # detail pages opened per source per run; the rest wait for the next run

# Parse stage of the promo job: raw items → promos.
Parser:
  Name: "claude"      # which adapter in promo/parser runs
  Retries: 3          # a failed item is parsed again on the next 3 runs
  BudgetUSD: 0.50     # per run, at the prices below; the rest waits for the next run
  HideBelow: 0.6      # promos read with less confidence are saved hidden

# Settings for the claude parser adapter. Keep APIKey empty; set ANTHROPIC_API_KEY in the environment.
Claude:
  APIKey: ""
  Model: "claude-haiku-5-5"
  Effort: "low"             # extraction needs no more; thinking is billed as output
  MaxTokens: 4096
  TimeoutSeconds: 60        # per attempt; a hung attempt is retried twice, then the item fails for this run
  InputUSDPerMTok: 0.10     # claude-haiku-5-5 list prices, for the budget
  OutputUSDPerMTok: 0.50
